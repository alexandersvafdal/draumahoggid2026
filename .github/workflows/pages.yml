name: Birta á GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Aðeins þessar skrár fara á vefinn. Skráningarsíðan (skra.html) og
      # ráslistinn eru vísvitandi ekki birt.
      - name: Setja saman birtingarmöppu
        run: |
          mkdir -p _site/data
          cp index.html config.js .nojekyll _site/
          cp -r assets _site/
          cp data/stada.json _site/data/
          # Stimpla útgáfunúmer á CSS/JS svo vafrar sæki ekki gamla útgáfu úr skyndiminni
          # (GitHub Pages sendir cache-control: max-age=600 á föst skjöl).
          sed -i "s/?v=dev/?v=${GITHUB_SHA:0:7}/g" _site/index.html
          echo "--- birt skjöl ---"
          find _site -type f | sort
          grep -o "?v=[a-z0-9]*" _site/index.html | sort -u

      - name: Staðfesta að ráslistinn sé hvergi í birtu efninu
        run: |
          if [ -e _site/skra.html ] || [ -e _site/data/keppni.json ] || [ -e _site/local ]; then
            echo "VILLA: skráningarsíða eða ráslisti komst inn í birtingarmöppuna"; exit 1
          fi
          if grep -rqi "raslisti" _site; then
            echo "VILLA: tilvísun í ráslista í birtu efni"; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
